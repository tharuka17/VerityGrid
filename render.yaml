# Render Blueprint for the VerityGrid READ-ONLY demo (synthetic data only).
# Deployed to Render's free plan on 2026-11-26 (see docs/DEPLOYMENT.md).
# - Both services are free Docker web services and contain no secrets and no API key.
# - autoDeployTrigger: commit deploys a service when a push to the linked branch changes a file that goes into
#   its image (buildFilter). Documents, tests and the other service's files do not trigger a deploy. Changes to
#   this file are applied by a Blueprint sync. Do not change these settings in the Render dashboard: the next
#   Blueprint sync would overwrite them.
# - Do not change VERITYGRID_MODE to development: a public deployment must stay read-only
#   (development mode is refused anyway while ENVIRONMENT is production).
services:
  - type: web
    name: veritygrid-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - Dockerfile.api
        - .dockerignore
        - requirements.txt
        - app/**
        - scripts/**
        - data/sample/**
        - data/evaluation/**
    envVars:
      - key: VERITYGRID_MODE
        value: demo
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: mock
      - key: DATABASE_URL
        value: sqlite:///./veritygrid_demo.db

  - type: web
    name: veritygrid-ui
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.ui
    dockerContext: .
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - Dockerfile.ui
        - .dockerignore
        - requirements.txt
        - ui/**
    envVars:
      # The API's PUBLIC address (free services cannot use the private network). It was entered by hand in the
      # Render dashboard; a Blueprint sync keeps an existing value for a sync: false variable.
      - key: VERITYGRID_API_URL
        sync: false